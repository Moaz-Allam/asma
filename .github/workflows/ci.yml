# CI — the layer an agent cannot talk its way past.
#
# Documentation can be ignored; a red pipeline cannot. The hooks in .claude/ stop
# violations at write time in an interactive session, but they do not run for a
# human commit, a rebase, or a branch pushed from another machine. This does.
#
# Three jobs (docs/engineering-approach.md §12): `checks` (fast, no database),
# `database` (pgTAP on a clean local stack), `e2e` (Playwright at 390px in ar,
# tr, en). Solo project (D18): there is no code owner gate, so this is the
# strongest automated control there is. Mark all three required on `master`
# (owner step S14) so a red build cannot be merged by accident.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the whole history

      # D27: a secret that reached any commit is leaked, even if a later commit removed it.
      # The binary is pinned and its checksum verified; never "latest", never piped to a shell.
      - name: Secret scan (gitleaks 8.30.1)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner --verbose .

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # Guards the guards. A guardrail that silently stops firing is worse than none,
      # because everyone still believes it works.
      - name: Write guard regression suite
        run: npm run guardrails

      # Rule 11: Next.js 16 silently ignores middleware.ts — no error, and route
      # protection becomes dead code.
      - name: No middleware.ts (must be proxy.ts)
        run: |
          if ls middleware.ts middleware.js src/middleware.ts 2>/dev/null | grep -q .; then
            echo "::error::middleware.ts is inert on Next.js 16. Rename to proxy.ts, exporting proxy()."
            exit 1
          fi

      # Rule 3: the outbox relay is the only mutating caller of lib/psp. ESLint enforces
      # the same door (architecture.md §42); this grep is the second layer.
      - name: No PSP call in a request path
        run: |
          hits=$(grep -rlE "from ['\"](@/lib/psp|.*(iyzico|iyzipay|paytabs))" \
                   --include='*.ts' --include='*.tsx' \
                   actions app lib components 2>/dev/null \
                 | grep -vE '^lib/psp/|outbox|relay|\.test\.|\.spec\.' || true)
          if [ -n "$hits" ]; then
            echo "::error::PSP imported outside lib/psp and the relay:"; echo "$hits"; exit 1
          fi

      # Rule 10: a key present in one catalogue and missing from another renders a
      # raw message key to a customer in production.
      - name: Message catalogues complete across ar/tr/en
        run: |
          node -e '
            const fs = require("fs");
            const flat = (o, p = "") => Object.entries(o).flatMap(([k, v]) =>
              v && typeof v === "object" ? flat(v, p + k + ".") : [p + k]);
            const locales = ["ar", "tr", "en"];
            const keys = Object.fromEntries(locales.map(l =>
              [l, new Set(flat(JSON.parse(fs.readFileSync(`messages/${l}.json`, "utf8"))))]));
            const all = new Set(locales.flatMap(l => [...keys[l]]));
            let bad = 0;
            for (const l of locales)
              for (const k of all)
                if (!keys[l].has(k)) { console.error(`::error::messages/${l}.json missing key: ${k}`); bad = 1; }
            process.exit(bad);
          '

      # D14: a domain table without a `region` column cannot be isolated per market, and
      # nothing fails until the second market goes live. Exemptions are an explicit list.
      - name: Region column on every domain table
        run: |
          exempt='regions|ledger_accounts|idempotency_records|psp_events|audit_log|notification_templates'
          fail=0
          for f in $(git ls-files 'supabase/migrations/*.sql' 2>/dev/null); do
            for t in $(grep -oiE 'create table (if not exists )?(public\.)?[a-z_]+' "$f" \
                       | awk '{print tolower($NF)}' | sed 's/^public\.//'); do
              echo "$t" | grep -qE "^($exempt)$" && continue
              awk -v tbl="$t" '
                tolower($0) ~ "create table (if not exists )?(public[.])?" tbl "[ (]" {inb=1}
                inb {print}
                inb && /^\);/ {inb=0}
              ' "$f" | grep -qiE '^\s*region\s' || {
                echo "::error file=$f::table '"'"'$t'"'"' has no region column (D14). Add one, or add it to the exempt list in ci.yml with a reason."
                fail=1; }
            done
          done
          exit $fail

      # Rule 7: a table created without RLS raises no error. It just returns every
      # row to every authenticated user.
      - name: RLS enabled on every created table
        run: |
          fail=0
          for f in $(git ls-files 'supabase/migrations/*.sql' 2>/dev/null); do
            for t in $(grep -oiE 'CREATE TABLE (IF NOT EXISTS )?(public\.)?[a-z_]+' "$f" \
                       | awk '{print tolower($NF)}' | sed 's/^public\.//'); do
              grep -qiE "ALTER TABLE (public\.)?$t ENABLE ROW LEVEL SECURITY" "$f" || {
                echo "::error file=$f::table '$t' created without RLS in the same migration"; fail=1; }
            done
          done
          exit $fail

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:rtl
      - run: npm run format:check
      - run: npm test

      # Local, shape valid values only: CI never holds cloud credentials. APP_LOCAL_ONLY marks a local
      # production build, so the deployment key checks (lib/deployment.ts, spec 0004 AC-9) stand aside.
      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          APP_LOCAL_ONLY: '1'
          NEXT_PUBLIC_SENTRY_DSN: https://ci000000000000000000000000000000@o0.ingest.de.sentry.io/0
          NEXT_PUBLIC_POSTHOG_KEY: phc_ci00000000000000000000000000000
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          APP_DEFAULT_LOCALE: ar
          APP_SUPPORTED_LOCALES: ar,tr,en
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54421
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-anon
          SUPABASE_SERVICE_ROLE_KEY: ci-build-service

  # pgTAP against a real Postgres with our migrations applied. RLS cannot be tested
  # against a mocked database. Includes the meta tests: RLS on every table, no
  # function executable by PUBLIC or anon, every definer function pins search_path.
  database:
    name: database
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.114.0 # same as the devDependency in package.json
      # R8, D188: pin Storage to the cloud project's version, as a linked local stack does from supabase/.temp
      # (gitignored); the CLI's default image lacks the archived_at column pgTAP 07 needs.
      - name: Pin the Storage version
        run: mkdir -p supabase/.temp && echo v1.96.4 > supabase/.temp/storage-version
      - run: supabase db start
      - name: pgTAP suite
        run: supabase test db
      # Spec 0005 AC-25: a security finding fails the build, in the same words the cloud project gets.
      - name: Security advisors
        run: supabase db advisors --local --type security --fail-on warn

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    # D189: 141 tests at 2 workers ran past 25 minutes and the job was cancelled.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # R8, D188: pin Storage to the cloud project's version, as a linked local stack does from supabase/.temp
      # (gitignored); the CLI's default image lacks the archived_at column pgTAP 07 needs.
      - name: Pin the Storage version
        run: mkdir -p supabase/.temp && echo v1.96.4 > supabase/.temp/storage-version
      - name: End to end journeys and public visual QA in ar, tr, en
        run: npm run test:e2e
      - name: Public page screenshots across locales and viewports
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: public-visual-qa
          path: test-results/**/public-visual/*.png
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
